# dbuild configuration file
# Full reference: https://github.com/daemonless/dbuild

build:
  architectures:
    - amd64
    - aarch64
  variants:
    - tag: latest
      containerfile: Containerfile
      default: true
      tag_desc: "Official upstream zot FreeBSD binary (auto-tracks latest release)."
    - tag: pkg
      containerfile: Containerfile.pkg
    - tag: pkg-latest
      containerfile: Containerfile.pkg
      args:
        BASE_VERSION: "15.1-latest"

cit:
  mode: screenshot
  port: 5000
  health: /v2/
  ready: "finished setting up ui routes"
