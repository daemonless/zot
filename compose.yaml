name: zot

x-daemonless:
  title: "zot"
  icon: ":material-package-variant-closed:"
  category: "Infrastructure"
  description: "Production-ready, vendor-neutral OCI image registry with a web UI, image search and vulnerability scanning."
  upstream_url: "https://github.com/project-zot/zot"
  web_url: "https://zotregistry.dev/"
  freshports_url: "https://www.freshports.org/sysutils/zot/"
  user: "bsd"
  mlock: false
  community: "Discord:https://discord.gg/Kb9tkhecZT"
  appjail: true

  docs:
    env:
      PUID: "User ID for the registry process"
      PGID: "Group ID for the registry process"
      TZ: "Timezone for the container"
    volumes:
      /config: "Configuration (config.json, written with a working default on first start)"
      /data: "Image storage and the registry's metadata database"
    ports:
      5000: "Registry API and web UI"

services:
  zot:
    image: ghcr.io/daemonless/zot:latest
    container_name: zot
    restart: unless-stopped

    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC

    volumes:
      - /path/to/containers/zot:/config
      - /path/to/containers/zot/data:/data

    ports:
      - "5000:5000"
